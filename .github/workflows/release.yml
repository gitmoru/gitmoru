# 버전을 올리고 npm 에 올린다.
#
# 손으로 버전을 고치면 언젠가 잊는다. 잊으면 고친 게 npm 에 안 올라가고,
# 받는 사람은 옛날 것을 계속 쓰면서 왜 안 고쳐졌는지 모른다.
#
# 커밋 메시지를 근거로 삼는다. 우리는 이미 그렇게 쓰고 있어서 새로 할 일이 없다.
#   fix:   -> 0.1.1
#   feat:  -> 0.2.0
#   feat!: -> 1.0.0
#
# 자동으로 올리지 않는다. release-please 가 "버전 올림" PR 을 열어두면
# 사람이 보고 머지한다. 무엇이 나가는지 한 번은 눈으로 본다.
name: release

on:
  push:
    branches: [main]
  # 손으로 한 번 돌려보고 싶을 때. 판단은 똑같이 커밋 메시지가 한다.
  workflow_dispatch:
    inputs:
      publish:
        # 태그는 끊겼는데 올리는 데서만 실패했을 때 쓰는 문이다.
        # 그 상황에서 release_created 는 다시 켜지지 않아서, 없으면 손이 묶인다.
        description: package.json 에 적힌 버전을 지금 npm 에 올린다
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # npm 에 우리가 누구인지 증명할 때 쓴다. 토큰을 만들지 않는 이유가 이것이다.
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.plan.outputs.release_created }}
      tag: ${{ steps.plan.outputs.tag_name }}
    steps:
      # release-please-config.json 은 두지 않는다. 한 번 뒀는데 아래 release-type 이
      # 그걸 덮어써서, 읽히지도 않으면서 다른 규칙이 적힌 채로 남아 있었다.
      # 기본 동작이 CONTRIBUTING 에 적어둔 표와 같아서 적을 것이 없다.
      #
      # **.release-please-manifest.json 은 지우면 안 된다.** 그건 설정이 아니라
      # 지금 버전이 몇인지 적어둔 파일이다. 한 번 같이 지웠다가 릴리스 PR 이
      # 고칠 대상을 잃고 충돌났다.
      - id: plan
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  publish:
    needs: prepare
    if: needs.prepare.outputs.released == 'true' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # node 22 에 딸려오는 npm 은 10.9 다. OIDC 로 우리가 누구인지 증명하려면
      # 11.5.1 이상이 필요하고, 그 아래에서는 인증 없이 올리려다 막힌다.
      # 그때 npm 이 돌려주는 건 401 이 아니라 404 다. 패키지가 없는 것처럼 보인다.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # 깨진 걸 올리면 남의 환경에서 깨진다. 검사를 통과해야 나간다.
      - run: pnpm check

      # 토큰이 없다. GitHub 이 OIDC 로 우리를 증명하고 npm 이 그걸 믿는다.
      # 샐 토큰이 없으면 새어 나갈 일도 없다.
      - run: npm publish
