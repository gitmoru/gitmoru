blank_issues_enabled: false

contact_links:
  - name: A security hole in gitmoru itself
    url: https://github.com/gitmoru/gitmoru/security/advisories/new
    about: Report it privately. Do not open a public issue for this.

  - name: How to write a report we can act on
    url: https://github.com/gitmoru/gitmoru/blob/main/CONTRIBUTING.md
    about: What we need, what to leave out. Also in English and 日本語.

  - name: What this tool refuses to do
    url: https://github.com/gitmoru/gitmoru/blob/main/SAFETY.md
    about: Read this before asking for a feature. Some of the obvious ones are closed on purpose.
