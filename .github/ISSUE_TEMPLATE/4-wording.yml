name: The wording reads wrong
description: Text that is unnatural, unclear, or says more than we know.
title: 'wording: '
labels: ['wording']
body:
  - type: markdown
    attributes:
      value: |
        The three languages are not translations of each other, they were written separately.
        So "the Japanese does not match the Korean" is fine on its own,
        what we are after is text that reads wrong **in its own language**.

  - type: dropdown
    id: lang
    attributes:
      label: Which language?
      options: ['한국어', 'English', '日本語']
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - In the app
        - README
        - gitmoru.dev
        - What the MCP server returns
    validations:
      required: true

  - type: input
    id: current
    attributes:
      label: What it says now
    validations:
      required: true

  - type: textarea
    id: better
    attributes:
      label: What it should say
      description: >
        A rough direction is enough, you do not have to hand us the final sentence.
        One thing it can never say, in any language, is that something is safe.
        We know a signal did not show up. We do not know it is not there.
    validations:
      required: true
